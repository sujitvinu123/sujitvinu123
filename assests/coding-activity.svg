<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 430"
     width="1200"
     height="430"
     role="img"
     aria-label="Sujitvinu coding activity dashboard">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d18"/>
      <stop offset="55%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#080b14"/>
    </linearGradient>

    <!-- Cards -->
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121a2b"/>
      <stop offset="100%" stop-color="#0c1321"/>
    </linearGradient>

    <!-- Graph fill -->
    <linearGradient id="graphFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

  </defs>


  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <rect width="1200" height="430" rx="18" fill="url(#bg)"/>

  <!-- subtle background glow -->
  <circle cx="1000" cy="80" r="160"
          fill="#2563eb"
          opacity=".06"
          filter="url(#softGlow)"/>

  <circle cx="180" cy="360" r="140"
          fill="#7c3aed"
          opacity=".04"
          filter="url(#softGlow)"/>


  <!-- ===================================================== -->
  <!-- HEADER -->
  <!-- ===================================================== -->

  <g font-family="'JetBrains Mono','Fira Code',monospace">

    <!-- LIVE indicator -->
    <circle cx="48" cy="48" r="4" fill="#3fb950">
      <animate
        attributeName="opacity"
        values=".3;1;.3"
        dur="1.4s"
        repeatCount="indefinite"/>
    </circle>

    <text x="60" y="52"
          fill="#3fb950"
          font-size="11"
          font-weight="bold"
          letter-spacing="4">
      LIVE · CODING ACTIVITY
    </text>

    <!-- right header -->
    <text x="1150" y="52"
          text-anchor="end"
          fill="#64748b"
          font-size="10"
          letter-spacing="3">
      SUJITVINU123 · 2026
    </text>

  </g>


  <!-- ===================================================== -->
  <!-- TITLE -->
  <!-- ===================================================== -->

  <text x="48" y="92"
        fill="#f1f5f9"
        font-family="'Inter',system-ui,sans-serif"
        font-size="27"
        font-weight="700">
    Coding Activity
  </text>

  <text x="48" y="116"
        fill="#64748b"
        font-family="'JetBrains Mono',monospace"
        font-size="11"
        letter-spacing="2">
    BUILD · DEBUG · SOLVE · SHIP
  </text>


  <!-- ===================================================== -->
  <!-- STAT CARDS -->
  <!-- ===================================================== -->

  <!-- COMMITS -->
  <g transform="translate(48,140)">

    <rect width="250"
          height="92"
          rx="12"
          fill="url(#card)"
          stroke="#1d2940"/>

    <text x="18" y="25"
          fill="#64748b"
          font-family="'JetBrains Mono',monospace"
          font-size="9"
          letter-spacing="3">
      COMMITS
    </text>

    <text x="18" y="61"
          fill="#f8fafc"
          font-family="'Inter',system-ui,sans-serif"
          font-size="30"
          font-weight="700">
      240
    </text>

    <text x="90" y="61"
          fill="#3fb950"
          font-family="'JetBrains Mono',monospace"
          font-size="10">
      total
    </text>

    <text x="18" y="79"
          fill="#3fb950"
          font-family="'JetBrains Mono',monospace"
          font-size="10">
      ▲ active contributor
    </text>

  </g>


  <!-- PROBLEMS -->
  <g transform="translate(316,140)">

    <rect width="250"
          height="92"
          rx="12"
          fill="url(#card)"
          stroke="#1d2940"/>

    <text x="18" y="25"
          fill="#64748b"
          font-family="'JetBrains Mono',monospace"
          font-size="9"
          letter-spacing="3">
      PROBLEMS SOLVED
    </text>

    <text x="18" y="61"
          fill="#f8fafc"
          font-family="'Inter',system-ui,sans-serif"
          font-size="30"
          font-weight="700">
      100+
    </text>

    <text x="18" y="79"
          fill="#a78bfa"
          font-family="'JetBrains Mono',monospace"
          font-size="10">
      DSA · LEETCODE
    </text>

  </g>


  <!-- PROJECTS -->
  <g transform="translate(584,140)">

    <rect width="250"
          height="92"
          rx="12"
          fill="url(#card)"
          stroke="#1d2940"/>

    <text x="18" y="25"
          fill="#64748b"
          font-family="'JetBrains Mono',monospace"
          font-size="9"
          letter-spacing="3">
      PROJECTS
    </text>

    <text x="18" y="61"
          fill="#f8fafc"
          font-family="'Inter',system-ui,sans-serif"
          font-size="30"
          font-weight="700">
      05+
    </text>

    <text x="18" y="79"
          fill="#58a6ff"
          font-family="'JetBrains Mono',monospace"
          font-size="10">
      AI · FULL STACK · SYSTEMS
    </text>

  </g>


  <!-- STREAK -->
  <g transform="translate(852,140)">

    <rect width="300"
          height="92"
          rx="12"
          fill="url(#card)"
          stroke="#1d2940"/>

    <text x="18" y="25"
          fill="#64748b"
          font-family="'JetBrains Mono',monospace"
          font-size="9"
          letter-spacing="3">
      CURRENT MODE
    </text>

    <text x="18" y="61"
          fill="#f8fafc"
          font-family="'Inter',system-ui,sans-serif"
          font-size="27"
          font-weight="700">
      BUILD MODE
    </text>

    <circle cx="270" cy="48" r="7"
            fill="#3fb950"
            filter="url(#glow)">
      <animate
        attributeName="r"
        values="6;9;6"
        dur="1.5s"
        repeatCount="indefinite"/>
    </circle>

    <text x="18" y="79"
          fill="#3fb950"
          font-family="'JetBrains Mono',monospace"
          font-size="10">
      ● SYSTEM ACTIVE
    </text>

  </g>


  <!-- ===================================================== -->
  <!-- ACTIVITY GRAPH -->
  <!-- ===================================================== -->

  <g transform="translate(48,252)">

    <rect width="1104"
          height="130"
          rx="14"
          fill="url(#card)"
          stroke="#1d2940"/>

    <!-- graph title -->

    <text x="20" y="25"
          fill="#64748b"
          font-family="'JetBrains Mono',monospace"
          font-size="9"
          letter-spacing="3">
      CONTRIBUTION VELOCITY · RECENT ACTIVITY
    </text>


    <!-- horizontal guides -->

    <line x1="20" y1="48"
          x2="1084" y2="48"
          stroke="#182236"
          stroke-width="1"/>

    <line x1="20" y1="76"
          x2="1084" y2="76"
          stroke="#182236"
          stroke-width="1"/>

    <line x1="20" y1="104"
          x2="1084" y2="104"
          stroke="#182236"
          stroke-width="1"/>


    <!-- graph area -->

    <polygon
      points="
      20,103
      65,95
      110,99
      155,82
      200,89
      245,72
      290,79
      335,61
      380,69
      425,54
      470,64
      515,47
      560,57
      605,43
      650,52
      695,36
      740,48
      785,39
      830,55
      875,44
      920,58
      965,42
      1010,51
      1055,34
      1084,40
      1084,110
      20,110"
      fill="url(#graphFill)"
    />


    <!-- graph line -->

    <polyline
      points="
      20,103
      65,95
      110,99
      155,82
      200,89
      245,72
      290,79
      335,61
      380,69
      425,54
      470,64
      515,47
      560,57
      605,43
      650,52
      695,36
      740,48
      785,39
      830,55
      875,44
      920,58
      965,42
      1010,51
      1055,34
      1084,40"
      fill="none"
      stroke="#58a6ff"
      stroke-width="2"
      filter="url(#glow)"
    />


    <!-- animated scanning line -->

    <line x1="20" y1="110"
          x2="20" y2="35"
          stroke="#58a6ff"
          stroke-width="1"
          opacity=".5">

      <animate
        attributeName="x1"
        values="20;1084;20"
        dur="7s"
        repeatCount="indefinite"/>

      <animate
        attributeName="x2"
        values="20;1084;20"
        dur="7s"
        repeatCount="indefinite"/>

    </line>


    <!-- live endpoint -->

    <circle cx="1084" cy="40"
            r="4"
            fill="#fef3c7"
            filter="url(#glow)">

      <animate
        attributeName="r"
        values="4;7;4"
        dur="1.4s"
        repeatCount="indefinite"/>

    </circle>


    <!-- date labels -->

    <g fill="#475569"
       font-family="'JetBrains Mono',monospace"
       font-size="8">

      <text x="20" y="123">MAY</text>
      <text x="260" y="123">JUN</text>
      <text x="500" y="123">JUL</text>
      <text x="740" y="123">AUG</text>
      <text x="1000" y="123">SEP</text>

    </g>

  </g>


  <!-- ===================================================== -->
  <!-- FOOTER -->
  <!-- ===================================================== -->

  <g font-family="'JetBrains Mono',monospace"
     font-size="10">

    <text x="48" y="410"
          fill="#475569"
          letter-spacing="2">
      SUJITVINU123 · JAVA · PYTHON · JAVASCRIPT · C++ · SQL
    </text>

    <text x="1152" y="410"
          text-anchor="end"
          fill="#3fb950"
          letter-spacing="2">
      ● CODING
    </text>

  </g>


</svg>

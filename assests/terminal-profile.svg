    </rect>

  </g>


  <!-- ===================================================== -->
  <!-- STATUS BAR -->
  <!-- ===================================================== -->

  <rect
    x="70"
    y="438"
    width="1060"
    height="27"
    rx="16"
    fill="#151b26"/>

  <text
    x="100"
    y="456"
    font-family="monospace"
    font-size="10"
    fill="#6e7681">

    UTF-8

  </text>

  <text
    x="160"
    y="456"
    font-family="monospace"
    font-size="10"
    fill="#6e7681">


  </text>


  <!-- ===================================================== -->
  <!-- MOVING SCAN EFFECT -->
  <!-- ===================================================== -->

  <rect
    x="70"
    y="80"
    width="1060"
    height="3"
    fill="url(#scan)"
    opacity="0.5">

    <animate
      attributeName="y"
      values="80;460;80"
      dur="8s"
      repeatCount="indefinite"/>

  </rect>

</svg>

<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 500"
     width="1200"
     height="500"
     role="img"
     aria-label="Sujitvinu R R animated developer profile">

  <defs>

    <!-- Background -->
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.5" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#080d16"/>
    </linearGradient>

    <!-- Accent -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#58a6ff"/>

      <animate
        attributeName="x1"
        values="0;1;0"
        dur="5s"
        repeatCount="indefinite"/>

      <animate
        attributeName="x2"
        values="1;0;1"
        dur="5s"
        repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Window shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dy="12"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.45"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline -->
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

  </defs>


  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <rect width="1200" height="500" fill="url(#stage)"/>

  <!-- subtle grid -->
  <g opacity="0.12" stroke="#58a6ff" stroke-width="0.5">

    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>

    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="800" y1="0" x2="800" y2="500"/>
    <line x1="1000" y1="0" x2="1000" y2="500"/>

  </g>


  <!-- ===================================================== -->
  <!-- TERMINAL -->
  <!-- ===================================================== -->

  <g filter="url(#shadow)">

    <rect
      x="70"
      y="35"
      width="1060"
      height="430"
      rx="16"
      fill="#0d1117"
      stroke="#263044"
      stroke-width="1"/>

    <!-- title bar -->

    <rect
      x="70"
      y="35"
      width="1060"
      height="44"
      rx="16"
      fill="#171d29"/>

    <rect
      x="70"
      y="59"
      width="1060"
      height="20"
      fill="#171d29"/>

    <line
      x1="70"
      y1="79"
      x2="1130"
      y2="79"
      stroke="#263044"
      stroke-width="1"/>

  </g>


  <!-- ===================================================== -->
  <!-- TRAFFIC LIGHTS -->
  <!-- ===================================================== -->

  <circle cx="100" cy="57" r="7" fill="#ff5f56"/>
  <circle cx="124" cy="57" r="7" fill="#ffbd2e"/>
  <circle cx="148" cy="57" r="7" fill="#27c93f"/>


  <!-- ===================================================== -->
  <!-- TERMINAL TITLE -->
  <!-- ===================================================== -->

  <text
